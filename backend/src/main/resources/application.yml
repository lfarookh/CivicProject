server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/civicnet}
    username: ${DB_USER:civicnet}
    password: ${DB_PASSWORD:civicnet}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}   # use "validate" + Flyway migrations in production
    open-in-view: false
app:
  jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32b}
  jwt-ttl-hours: 72
  cors-origins: ${CORS_ORIGINS:*}
management:
  endpoints.web.exposure.include: health
